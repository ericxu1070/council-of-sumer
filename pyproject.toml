[project]
name = "council-of-sumer"
version = "0.1.0"
description = "Seven AI advisors with competing goals govern ancient Sumer (Hamurabi, 1968) by debating in turns over AGNTCY SLIM, with no king to break ties."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agntcy-app-sdk==0.5.5",
    "ioa-observe-sdk==1.0.41",
    "cryptography==50.0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[project.scripts]
sumer = "sumer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sumer"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
