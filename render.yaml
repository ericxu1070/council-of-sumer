# Free hosted demo: five independent advisor decisions in one server process.
services:
  - type: web
    name: council-of-sumer
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: sumer web
    healthCheckPath: /api/meta
    autoDeployTrigger: "off"
    envVars:
      - key: BAYLEAF_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: BAYLEAF_BASE_URL
        value: https://api.bayleaf.dev/v1
      - key: BAYLEAF_MODEL
        value: openrouter:deepseek/deepseek-v4.1-flash
      - key: LLM_TIMEOUT_S
        value: "90"
      - key: LLM_REASONING
        value: "true"
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_MAX_TOKENS
        value: "1536"
      - key: LLM_BUDGET_USD
        value: "3.00"
      - key: TRANSPORT
        value: inproc
      - key: SUMER_OBSERVE
        value: "false"
